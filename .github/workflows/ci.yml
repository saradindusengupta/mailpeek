name: extension CI

on:
  push:
    paths:
      - "extension/**"
  pull_request:
    paths:
      - "extension/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: xvfb-run -a npm test
